<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Image Lab</title>
<!-- The palette, and Commit Mono with it. Like the files app, this page is a
     document in its own frame and inherits nothing from the desk around it.
     Without garden.css every colour below would fall back to a literal. -->
<link rel="stylesheet" href="/css/garden.css">
<link rel="stylesheet" href="/css/image-lab.css">
</head>
<body class="lab">

<aside class="lab-rail" id="lab-rail">
	<h2 class="lab-rail-title">Library</h2>
	<ul class="lab-shelf" id="lab-folders"></ul>
	<h2 class="lab-rail-title">Inspiration</h2>
	<ul class="lab-shelf" id="lab-boards"></ul>
	<button type="button" class="lab-rail-action" id="lab-connect">Connect Pinterest</button>
</aside>

<main class="lab-main">
	<div class="lab-grid" id="lab-grid" aria-live="polite"></div>
	<p class="lab-empty" id="lab-empty" hidden></p>
</main>

<form class="lab-bar" id="lab-bar">
	<div class="lab-picked" id="lab-picked" hidden></div>
	<div class="lab-compose">
		<textarea id="lab-prompt" rows="1" placeholder="Describe a picture&#8230;" aria-label="prompt"></textarea>
		<button type="submit" id="lab-send">Send</button>
	</div>
	<p class="lab-note" id="lab-note" hidden></p>
</form>

<script type="module" src="/js/image-lab.js"></script>
</body>
</html>
